name: Create eclearance Word doc

# On-demand only. Run it from the Actions tab when you need an eclearance review
# document: click "Create eclearance Word doc" -> "Run workflow", type a chapter
# path (or leave it blank to export the whole guide), and click the green button.
# It always builds the site from the `preview` branch, converts the content (with
# working internal/external links) via the web-to-word action in this repo, and
# attaches the .docx as a downloadable artifact. Nothing runs automatically on
# push or PR.
#
# Always `preview` on purpose: the document's out-of-scope links point at the
# preview site, which only reflects the `preview` branch. Building from any other
# branch would make the content and its links come from different versions. To
# review a feature branch, push it to `preview` first (see contributing/workflow.md).
#
# Two checkouts, on purpose. The converter is a local action, and a local action
# is resolved from the workspace root, so the root checkout must be the branch
# that holds it (the one picked in "Use workflow from"). The site content is a
# different branch, so `preview` is checked out separately into site/.

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter path under docs/ without .html (e.g. "before-you-deploy"). LEAVE BLANK to export the entire guide.'
        required: false
        type: string

permissions:
  contents: read

env:
  # Match the preview environment so links resolve exactly as on the staging site.
  BASEURL: /CDCgov-NEDSS-SystemAdminGuide-preview
  # The site is built/served on localhost during the run; out-of-scope links are
  # rewritten from the localhost origin to this public preview origin so they
  # work when a reviewer clicks them.
  PREVIEW_PUBLIC_HOST: https://jburgh.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (provides the web-to-word action)
        uses: actions/checkout@v7

      - name: Checkout the preview branch (provides the site content)
        uses: actions/checkout@v7
        with:
          ref: preview
          path: site

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"   # matches jekyll-preview.yml
          bundler-cache: true
          working-directory: site

      - name: Build and serve the site locally
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl "$BASEURL"
          bundle exec jekyll serve --detach --skip-initial-build \
            --baseurl "$BASEURL" --host 127.0.0.1 --port 4000
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:4000$BASEURL/" && break
            sleep 1
          done

      - name: Work out what to convert
        id: target
        env:
          CHAPTER: ${{ github.event.inputs.chapter }}
        run: |
          set -euo pipefail
          if [ -z "$CHAPTER" ]; then
            # Whole guide: point at any page that renders the nav (the site home).
            echo "url=http://127.0.0.1:4000$BASEURL/" >> "$GITHUB_OUTPUT"
            echo "name=full-guide" >> "$GITHUB_OUTPUT"
            echo "whole_guide=true" >> "$GITHUB_OUTPUT"
          else
            # Normalize: strip a leading slash, a leading "docs/", and a trailing ".html".
            path="${CHAPTER#/}"; path="${path#docs/}"; path="${path%.html}"
            echo "url=http://127.0.0.1:4000$BASEURL/docs/${path}.html" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
            echo "whole_guide=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert the chapter to Word
        uses: ./.github/actions/web-to-word
        with:
          url: ${{ steps.target.outputs.url }}
          output: ${{ steps.target.outputs.name }}-review.docx
          public-host: ${{ env.PREVIEW_PUBLIC_HOST }}
          whole-guide: ${{ steps.target.outputs.whole_guide }}

      - name: Upload the review document
        uses: actions/upload-artifact@v7
        with:
          name: eclearance-review-doc
          path: "*-review.docx"
          if-no-files-found: error
