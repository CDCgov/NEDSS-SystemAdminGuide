name: Create eclearance Word doc

# On-demand only. Run it from the Actions tab when you need an eclearance review
# document for a chapter: click "Create eclearance Word doc" -> "Run workflow",
# type the chapter path, and click the green button. It always builds from the
# `preview` branch, converts that chapter (with working internal/external links)
# via the web2word tool, and attaches the .docx as a downloadable artifact.
# Nothing runs automatically on push or PR.
#
# Always `preview` on purpose: the document's out-of-scope links point at the
# preview site, which only reflects the `preview` branch. Building from any other
# branch would make the content and its links come from different versions. To
# review a feature branch, push it to `preview` first (see contributing/workflow.md).

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter path under docs/ without .html (e.g. "before-you-deploy" or "deploy-nbs7/microservices-deployment/data-processing")'
        required: true
        type: string

permissions:
  contents: read

env:
  WEB2WORD_REPO: https://github.com/jburgh/web-to-word.git
  WEB2WORD_REF: main
  # Match the preview environment so links resolve exactly as on the staging site.
  BASEURL: /CDCgov-NEDSS-SystemAdminGuide-preview
  # The site is built/served on localhost during the run; out-of-scope links are
  # rewritten from the localhost origin to this public preview origin so they
  # work when a reviewer clicks them.
  PREVIEW_PUBLIC_HOST: https://jburgh.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the preview branch
        uses: actions/checkout@v7
        with:
          ref: preview

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"   # matches jekyll-preview.yml
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Pandoc (pinned — distro apt ships an older reference.docx
              that breaks the styling; must match the validated version)
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Get the web2word converter
        run: |
          git clone --depth 1 --branch "$WEB2WORD_REF" "$WEB2WORD_REPO" .web2word
          pip install -r .web2word/requirements.txt
          python .web2word/scripts/make_reference.py .web2word/styles.docx

      - name: Build and serve the site locally
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl "$BASEURL"
          bundle exec jekyll serve --detach --skip-initial-build \
            --baseurl "$BASEURL" --host 127.0.0.1 --port 4000
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:4000$BASEURL/" && break
            sleep 1
          done

      - name: Convert the chapter to Word
        env:
          CHAPTER: ${{ github.event.inputs.chapter }}
          # The converter is cloned into .web2word/ but not pip-installed as a
          # package, so put its parent on the path for `python -m web2word`.
          PYTHONPATH: .web2word
        run: |
          set -euo pipefail
          # Normalize: strip a leading slash, a leading "docs/", and a trailing ".html".
          path="${CHAPTER#/}"; path="${path#docs/}"; path="${path%.html}"
          url="http://127.0.0.1:4000$BASEURL/docs/${path}.html"
          name="$(basename "$path")"
          echo "Converting $url"
          python -m web2word "$url" \
            -o "${name}-review.docx" \
            --style-reference .web2word/styles.docx \
            --public-host "$PREVIEW_PUBLIC_HOST" -v
          python .web2word/scripts/verify.py "${name}-review.docx"

      - name: Upload the review document
        uses: actions/upload-artifact@v7
        with:
          name: eclearance-review-doc
          path: "*-review.docx"
          if-no-files-found: error
